<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5b4bdb">
  <meta name="description" content="Create an account to book English classes.">
  <title data-i18n="pageTitleRegister">Register - English Class Booking</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">EC</span>
        <span class="brand-text"><strong data-i18n="appName">📖 English Class</strong><small data-i18n="v3_brandTag">Multi-teacher class board</small></span>
      </a>
      <div class="nav-links" id="main-links">
        <a class="nav-link" data-nav="board" href="/" data-i18n="navBackHome">← Back to Schedule</a>
      </div>
      <div class="topbar-right">
        <div id="nav-lang"></div>
        <div id="nav-right"></div>
      </div>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1 data-i18n="registerTitle">✨ Create Account</h1>
      <p class="auth-sub" data-i18n="registerSubtitle">Register to book classes online</p>

      <div id="google-auth-section" class="hidden" style="margin-bottom:16px">
        <button type="button" class="btn btn-ghost btn-block" onclick="handleGoogleAuth()">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span data-i18n="googleSignUp">Sign up with Google</span>
        </button>
        <div style="text-align:center;color:var(--muted);font-size:12px;margin:10px 0" data-i18n="authOrDivider">or register with PIN</div>
      </div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="field">
          <label for="username" data-i18n="registerUsername">Username *</label>
          <input type="text" id="username" name="username" required autocomplete="username" data-i18n-placeholder="registerUsernamePlaceholder">
        </div>
        <div class="field">
          <label for="displayName" data-i18n="registerDisplayName">Your Name *</label>
          <input type="text" id="displayName" name="displayName" required autocomplete="name" data-i18n-placeholder="registerDisplayNamePlaceholder">
        </div>
        <div class="field">
          <label for="phone" data-i18n="registerPhone">Phone Number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" data-i18n-placeholder="registerPhonePlaceholder">
        </div>
        <div class="field">
          <label data-i18n="registerPIN">4-Digit PIN *</label>
          <div class="pin-row" id="pin-row">
            <input class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN 1">
            <input class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN 2">
            <input class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN 3">
            <input class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN 4">
          </div>
          <div class="field-hint" data-i18n="registerPINHint">Enter a 4-digit PIN as your password</div>
        </div>
        <div class="field">
          <label data-i18n="registerConfirmPIN">Confirm PIN *</label>
          <div class="pin-row" id="cpin-row">
            <input class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Confirm 1">
            <input class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Confirm 2">
            <input class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Confirm 3">
            <input class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Confirm 4">
          </div>
        </div>
        <div class="field">
          <label for="teacherCode" data-i18n="v3_registerTeacherCode">Teacher invite code</label>
          <input type="text" id="teacherCode" name="teacherCode" autocomplete="off" placeholder="TEACHER2026">
          <div class="field-hint" data-i18n="v3_registerTeacherCodeHint">Teachers only. Leave blank for a student account.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="register-btn" data-i18n="registerButton">Register</button>
      </form>

      <div class="auth-links">
        <span data-i18n="registerHasAccount">Already have an account?</span>
        <a href="/login.html" data-i18n="registerLoginLink">Login</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner"><span data-i18n="footerText">Interested In My Classes? Book Now!</span><span data-i18n="v3_footerMade">v3.0</span></div>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/i18n-v3.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
